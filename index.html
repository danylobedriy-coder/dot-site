<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>DOT — робочий простір</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap">

<body>
<div class="wrap">
  <nav class="topnav" aria-label="Навігація"><div class="crumbs"><a class="crumb" href="/" aria-current="page">DOT</a></div></nav>

  <section class="card">
    <div class="tabrow"><span class="tab">Робочий простір</span></div>
    <div class="inner">
      <h1>DOT</h1>

  <div class="tiles">

      <span class="tile-n">02</span>
      <span class="tile-t">Наступне</span>
      <span class="tile-d">Нові задачі з'являтимуться тут.</span>
